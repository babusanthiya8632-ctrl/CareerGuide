<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerGuide Chatbot</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --background: #f4f6fb;
            --card: #ffffff;
            --text: #172033;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .chatbot {
            width: min(100%, 760px);
            height: min(90vh, 760px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(31, 41, 55, 0.12);
        }

        .header {
            padding: 22px;
            color: white;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
        }

        .header h1 { margin: 0 0 6px; font-size: 25px; }
        .header p { margin: 0; opacity: .9; }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .bot {
            align-self: flex-start;
            background: #eef2ff;
            border-bottom-left-radius: 4px;
        }

        .user {
            align-self: flex-end;
            color: white;
            background: var(--primary);
            border-bottom-right-radius: 4px;
        }

        .composer {
            display: flex;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .composer input {
            flex: 1;
            min-width: 0;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        .composer input:focus { border-color: var(--primary); }

        .composer button {
            border: 0;
            border-radius: 12px;
            padding: 0 20px;
            color: white;
            background: var(--primary);
            cursor: pointer;
            font-weight: bold;
        }

        .composer button:hover { background: var(--primary-dark); }
        .composer button:disabled { opacity: .6; cursor: not-allowed; }

        @media (max-width: 520px) {
            body { padding: 0; }
            .chatbot { height: 100vh; border-radius: 0; }
            .message { max-width: 92%; }
        }
    </style>
</head>
<body>
    <main class="chatbot">
        <header class="header">
            <h1>CareerGuide</h1>
            <p>Your study, technology, and career guidance assistant</p>
        </header>

        <section class="messages" id="messages" aria-live="polite">
            <div class="message bot">
                Hi! I’m CareerGuide. Ask me anything about studies, programming,
                projects, skills, resumes, interviews, or careers.
            </div>
        </section>

        <form class="composer" id="chatForm">
            <input
                id="messageInput"
                type="text"
                placeholder="Ask a study or career question..."
                autocomplete="off"
                required
            >
            <button id="sendButton" type="submit">Send</button>
        </form>
    </main>

    <script>
        const form = document.getElementById("chatForm");
        const input = document.getElementById("messageInput");
        const messages = document.getElementById("messages");
        const sendButton = document.getElementById("sendButton");

        function addMessage(text, type) {
            const message = document.createElement("div");
            message.className = `message ${type}`;
            message.textContent = text;
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";
            input.disabled = true;
            sendButton.disabled = true;
            sendButton.textContent = "Sending...";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                addMessage(data.reply || "No response received.", "bot");
            } catch (error) {
                addMessage("Unable to connect to the server. Please try again.", "bot");
            } finally {
                input.disabled = false;
                sendButton.disabled = false;
                sendButton.textContent = "Send";
                input.focus();
            }
        });
    </script>
</body>
</html>
